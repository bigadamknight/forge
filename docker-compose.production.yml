services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5462:5432"
    volumes:
      - forge_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: forge-api
    restart: unless-stopped
    ports:
      - "3191:3071"
    environment:
      DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD}@postgres:5432/forge
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID}
      AZURE_OPENAI_EMBEDDING_URL: ${AZURE_OPENAI_EMBEDDING_URL}
      AZURE_OPENAI_EMBEDDING_API_KEY: ${AZURE_OPENAI_EMBEDDING_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: forge-web
    restart: unless-stopped
    ports:
      - "3190:80"
    depends_on:
      - api

volumes:
  forge_prod_data:
